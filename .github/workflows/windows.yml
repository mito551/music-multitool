name: windows-exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller PySide6
      - run: pyinstaller --noconfirm packaging/audiotoolkit.spec
      - uses: actions/upload-artifact@v4
        with:
          name: AudioToolkit.exe
          path: dist/AudioToolkit.exe
