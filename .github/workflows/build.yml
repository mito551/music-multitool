name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller PySide6
      - run: pyinstaller --noconfirm packaging/audiotoolkit.spec
      - uses: actions/upload-artifact@v4
        with:
          name: AudioToolkit-windows
          path: dist/AudioToolkit.exe

  linux:
    runs-on: ubuntu-22.04  # old glibc: the AppImage runs on newer systems
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1
      - run: pip install pyinstaller PySide6
      - run: packaging/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AudioToolkit-linux
          path: dist/AudioToolkit-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AudioToolkit.exe
            artifacts/AudioToolkit-x86_64.AppImage
