[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "audiotoolkit"
version = "0.1.0"
description = "GTK4 UI over demucs, dettato and small audio tools"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real models"]
addopts = "-m 'not slow'"
