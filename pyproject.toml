[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "audiotoolkit"
version = "0.1.0"
description = "GTK4 front end for stem separation, audio-to-MIDI, lyrics, sheet-music scanning and small audio tools"
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["Environment :: X11 Applications :: GTK", "Topic :: Multimedia :: Sound/Audio"]
# No dependencies on purpose: PyGObject/GTK4/libadwaita come from the system, and the heavy worker environment (torch,
# demucs, dettato, copisteria, ...) is built from the app's Settings.
dependencies = []

[project.optional-dependencies]
qt = ["PySide6>=6.5"]  # the Qt interface; Windows needs it, Linux can use the distribution's python3-pyside6

[project.scripts]
audio-toolkit = "audiotoolkit.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audiotoolkit = ["presets/*.json", "ui/style.css", "*.svg", "*.desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real models"]
addopts = "-m 'not slow'"
